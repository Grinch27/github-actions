name: Switch GCC

description: Switch GCC

author: "Grinch27"

inputs:
  gcc_version:
    description: "GCC version to switch to (e.g., 7, 8, 9, 10, 11, 12, 13, 14, 15); empty for auto"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Switch GCC
      id: switch-gcc
      if: ${{ inputs.gcc_version != '' }}
      shell: bash
      working-directory: /
      env:
        DEBIAN_FRONTEND: noninteractive
        gcc_version: ${{ inputs.gcc_version }}
      run: |
        echo "Setting alternatives for GCC version ${gcc_version}"

        tools_gcc=(
          "gcc"
          "gcc-ar"
          "gcc-nm"
          "gcc-ranlib"
          "g++"
        )

        # 安装可用的版本到 alternatives
        for tool in "${tools_gcc[@]}"; do
          versions=$(ls /usr/bin/${tool}-* | grep -Eo '[0-9]+$' | sort -u)
          for ver in ${versions}; do
            sudo update-alternatives --install /usr/bin/${tool} ${tool} /usr/bin/${tool}-${ver} ${ver}
          done
        done

        # 查看配置
        sudo update-alternatives --query gcc
        sudo update-alternatives --query g++

        # 切换到指定版本
        for tool in "${tools_gcc[@]}"; do
          sudo update-alternatives --set ${tool} /usr/bin/${tool}-${gcc_version}
        done

        # ========== reload ==========
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E systemctl daemon-reload
        df -Th

        echo "Switched to GCC/G++ version: ${gcc_version}"

    - name: Check GCC
      id: check-gcc
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set +e

        echo "Current GCC version:"
        gcc --version || echo "GCC not found"
        g++ --version || echo "G++ not found"

        echo "Available GCC versions in /usr/bin/:"
        ls /usr/bin/gcc-* /usr/bin/g++-* || echo "No GCC versions found"

        set -e
