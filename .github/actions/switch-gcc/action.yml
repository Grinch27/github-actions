name: Switch GCC

description: Switch GCC

author: "Grinch27"

inputs:
  gcc_version:
    description: "GCC version to switch to (e.g., 7, 8, 9, 10, 11, 12, 13, 14, 15); empty for auto"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: (Vars) Resolve suffix
      id: vars
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        gcc_version: ${{ inputs.gcc_version }}
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th
        sudo -E apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        if [ -n "${{ env.gcc_version }}" ]; then
          pkg_suffix="-${{ env.gcc_version }}"
          lib_version="${{ env.gcc_version }}"
        else
          pkg_suffix=""
          lib_version=""
        fi
        echo "pkg_suffix=$pkg_suffix" >> "$GITHUB_OUTPUT"
        echo "lib_version=$lib_version" >> "$GITHUB_OUTPUT"

    - name: Configure alternatives
      id: alternatives
      if: ${{ inputs.gcc_version != '' }}
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        pkg_suffix: ${{ steps.vars.outputs.pkg_suffix }}
        lib_version: ${{ steps.vars.outputs.lib_version }}
      working-directory: /
      run: |
        tools_gcc=(
          "gcc"
          # "cpp"
          "gcc-ar"
          "gcc-nm"
          "gcc-ranlib"
          "g++"
          # "gcov"
          # "gcov-dump"
          # "gcov-tool"
          # "lto-dump"
        )
        for tool in "${tools_gcc[@]}"; do
          versions=$(ls /usr/bin/${tool}-* 2>/dev/null | grep -Eo '[0-9]+$' | sort -u)
          for version in ${versions}; do
            sudo update-alternatives --install /usr/bin/${tool} ${tool} /usr/bin/${tool}-${version} ${version}
          done
        done
        sudo update-alternatives --query gcc
        sudo update-alternatives --query g++

        for tool in "${tools_gcc[@]}"; do
          sudo update-alternatives --set ${tool} /usr/bin/${tool}-${{ env.lib_version }}
        done

    - name: (Apt) Reload
      id: apt-reload
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E systemctl daemon-reload
        df -Th

