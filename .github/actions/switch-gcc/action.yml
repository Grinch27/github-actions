name: Switch GCC

description: Switch GCC

author: "Grinch27"

inputs:
  gcc_version:
    description: "GCC version to switch to (e.g., 7, 8, 9, 10, 11, 12, 13, 14, 15); empty for auto"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: (Vars) Resolve suffix
      id: vars
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        gcc_version: ${{ inputs.gcc_version }}
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        df -Th
        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        if [ -n "${{ env.gcc_version }}" ]; then
          pkg_suffix="-${{ env.gcc_version }}"
          lib_version="${{ env.gcc_version }}"
        else
          pkg_suffix=""
          lib_version=""
        fi
        echo "pkg_suffix=$pkg_suffix" >> "$GITHUB_OUTPUT"
        echo "lib_version=$lib_version" >> "$GITHUB_OUTPUT"

    - name: Configure alternatives
      id: alternatives
      if: ${{ inputs.gcc_version != '' }}
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        pkg_suffix: ${{ steps.vars.outputs.pkg_suffix }}
        lib_version: ${{ steps.vars.outputs.lib_version }}
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        tools_gcc=(
          "gcc"
          # "cpp"
          "gcc-ar"
          "gcc-nm"
          "gcc-ranlib"
          "g++"
          # "gcov"
          # "gcov-dump"
          # "gcov-tool"
          # "lto-dump"
        )
        for tool in "${tools_gcc[@]}"; do
          versions=$(ls /usr/bin/${tool}-* 2>/dev/null | grep -Eo '[0-9]+$' | sort -u)
          for version in ${versions}; do
            run_sudo update-alternatives --install /usr/bin/${tool} ${tool} /usr/bin/${tool}-${version} ${version}
          done
        done
        run_sudo update-alternatives --query gcc
        run_sudo update-alternatives --query g++

        for tool in "${tools_gcc[@]}"; do
          run_sudo update-alternatives --set ${tool} /usr/bin/${tool}-${{ env.lib_version }}
        done

    - name: (Apt) Reload
      id: apt-reload
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
