name: Purge Snap

description: Purge snapd and related data from the runner

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Ensure run_sudo
      uses: Grinch27/github-actions/.github/actions/run-sudo@main

    - name: Purge Snap
      id: purge_snap
      shell: bash
      continue-on-error: true
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th

        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        if command -v snap >/dev/null 2>&1; then
          run_sudo snap list || true
          for p in $(snap list | awk 'NR>1 {print $1}'); do
            run_sudo snap remove "$p"
          done
          run_sudo systemctl stop snapd || true
          run_sudo systemctl disable --now snapd.socket || true
          run_sudo apt-get -yqq autoremove --purge snapd || true
        fi

        run_sudo rm -rf ~/snap
        run_sudo rm -rf /snap
        run_sudo rm -rf /var/snap
        run_sudo rm -rf /var/lib/snapd
        run_sudo rm -rf /var/cache/snapd

        run_sudo bash -c 'cat <<EOF > /etc/apt/preferences.d/nosnap.pref
        Package: snapd
        Pin: release a=*
        Pin-Priority: -10
        EOF'

        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        run_sudo_env systemctl daemon-reload
        df -Th
