name: Purge Snap

description: Purge snapd and related data from the runner

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Purge Snap
      id: purge_snap
      shell: bash
      # continue-on-error: true
      working-directory: /
      run: |
        # Scope: Ubuntu/Linux jobs; skip all Snap cleanup in detected containers.
        # Unknown: unrecognized containers without markers or systemd-detect-virt.
        # Risk: native APT maintainer scripts may still invoke services directly.
        # Verify: early exit before mutations; native commands unchanged; Step failures propagate.
        if [ -f /.dockerenv ] ||
           [ -f /run/.containerenv ] ||
           { command -v systemd-detect-virt >/dev/null 2>&1 &&
             systemd-detect-virt --container --quiet; }; then
          echo "Skip Snap cleanup inside container"
          exit 0
        fi

        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        run_sudo true
        echo -e "Current working directory: $(pwd)"
        df -Th

        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        if command -v snap >/dev/null 2>&1; then
          if [ ! -f /.dockerenv ] &&
             [ ! -f /run/.containerenv ] &&
             [ -d /run/systemd/system ] &&
             command -v systemctl >/dev/null 2>&1; then
            if snap_list=$(run_sudo snap list); then
              printf '%s\n' "$snap_list"
              while IFS= read -r p; do
                run_sudo snap remove "$p"
              done < <(printf '%s\n' "$snap_list" | awk 'NR>1 {print $1}')
            else
              echo "Unable to list installed snaps; continue with snapd cleanup" >&2
            fi
            run_sudo systemctl disable --now snapd.socket || true
            run_sudo systemctl stop snapd.service || true
          else
            echo "Skip Snap service management outside native systemd environment"
          fi
          run_sudo apt-get -yqq autoremove --purge snapd || true
        fi

        run_sudo rm -rf ~/snap
        run_sudo rm -rf /snap
        run_sudo rm -rf /var/snap
        run_sudo rm -rf /var/lib/snapd
        run_sudo rm -rf /var/cache/snapd

        run_sudo bash -c 'cat <<EOF > /etc/apt/preferences.d/nosnap.pref
        Package: snapd
        Pin: release a=*
        Pin-Priority: -10
        EOF'

        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
