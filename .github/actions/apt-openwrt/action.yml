name: Apt OpenWrt
# Scope: prepare OpenWrt and U-Boot build dependencies on Ubuntu.
# Risk: optional package names can change with the runner or container release.
# Verify: batch resolution on both Ubuntu routes and failure propagation.
description: Install OpenWrt build dependencies
author: "Grinch27"

inputs:
  prepare_container:
    description: Install sudo and provide the python alias for a build container.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install OpenWrt build dependencies
      id: apt-openwrt
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        PREPARE_CONTAINER: ${{ inputs.prepare_container }}
      working-directory: /
      run: |
        set -euo pipefail

        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        required_packages=(
          bc binutils bison build-essential bzip2 ca-certificates curl file flex gawk gcc g++
          genisoimage git libelf-dev libncurses-dev libssl-dev make patch perl pkgconf python3 rsync
          tar unzip wget xz-utils zlib1g-dev
        )
        optional_packages=(
          7zip ack antlr3 asciidoc autoconf automake autopoint clang clangd cmake cpio
          device-tree-compiler dwarves ecj fastjar git-lfs gnupg gperf
          haveged help2man intltool jq libglib2.0-dev libgmp-dev libltdl-dev
          libmpc-dev libmpfr-dev libreadline-dev libtool libxml2 libxml2-utils
          lld lldb lz4 lzop ninja-build python3-pip
          python3-setuptools python3-socks python3-unidecode re2c schedtool scons
          squashfs-tools subversion swig uglifyjs vim xsltproc zip
        )

        if [[ "$PREPARE_CONTAINER" == true ]]; then
          required_packages+=(sudo)
        fi

        run_sudo apt-get -yqq --error-on=any update
        candidates=$(LC_ALL=C apt-cache policy "${optional_packages[@]}" |
          awk -v requested="${optional_packages[*]}" '
            /^[^[:space:]]+:/ { package = $1; sub(/:$/, "", package) }
            $1 == "Candidate:" && $2 != "(none)" { available[package] = 1 }
            END {
              count = split(requested, packages)
              for (i = 1; i <= count; i++) {
                package = packages[i]
                if (package in available)
                  printf "%s ", package
                else
                  printf "No APT candidate for %s\n", package > "/dev/stderr"
              }
            }')
        read -r -a available_packages <<< "$candidates"

        # A missing optional candidate is skipped. APT transaction errors stop the build.
        run_sudo env "DEBIAN_FRONTEND=$DEBIAN_FRONTEND" apt-get -yqq install \
          "${required_packages[@]}" "${available_packages[@]}"

        if [[ "$PREPARE_CONTAINER" == true ]]; then
          run_sudo ln -sf /usr/bin/python3 /usr/bin/python
        fi

        run_sudo env "DEBIAN_FRONTEND=$DEBIAN_FRONTEND" apt-get -yqq autoremove --purge
        run_sudo apt-get -qq clean
