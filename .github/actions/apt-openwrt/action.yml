name: Apt OpenWrt

description: Apt OpenWrt

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Apt OpenWrt
      id: apt-openwrt
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set -euo pipefail

        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        echo -e "Current working directory: $(pwd)"
        df -Th

        # 统一 root 执行入口，兼容容器内无 sudo 的场景
        run_sudo apt-get -yqq update

        packages_install=(
          "ack"
          "antlr3"
          "asciidoc"
          "autoconf"
          "automake"
          "autopoint"
          "bc"
          "binutils"
          "bison"
          "build-essential"
          "bzip2"
          "ca-certificates"
          "clang"
          "clangd"
          "cmake"
          "cpio"
          "curl"
          "device-tree-compiler"
          "dwarves"
          "ecj"
          "fastjar"
          "flex"
          "gawk"
          "g++"
          "gcc"
          # "gcc-aarch64-linux-gnu"
          "git"
          "git-lfs"
          "gnupg"
          "gperf"
          "haveged"
          "help2man"
          "intltool"
          "jq"
          "libelf-dev"
          "libglib2.0-dev"
          "libgmp3-dev"
          "libltdl-dev"
          "libmpc-dev"
          "libmpfr-dev"
          "libncurses5-dev"
          "libreadline-dev"
          "libssl-dev"
          "libtool"
          "libxml2"
          "libxml2-utils"
          "lld"
          "lldb"
          "lz4"
          "lzop"
          "make"
          "mkisofs"
          "ninja-build"
          "p7zip-full"
          "patch"
          "pkgconf"
          "python3"
          "python3-pip"
          "python3-setuptools"
          "python3-pysocks"
          "python3-unidecode"
          "re2c"
          "rsync"
          "schedtool"
          "scons"
          "squashfs-tools"
          "subversion"
          "swig"
          "uglifyjs"
          "unzip"
          "vim"
          "wget"
          "xsltproc"
          "zip"
          "zlib1g-dev"
        )

        # 逐包安装，单个包缺失时不中断整个 OpenWrt 依赖准备
        set +e
        for pkg in "${packages_install[@]}"; do
          run_sudo apt-get -yqq install "$pkg" || echo "Skip missing package: $pkg"
        done
        set -e

    - name: (Apt) Reload
      id: apt-reload
      if: always()
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set -euo pipefail

        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        echo -e "Current working directory: $(pwd)"

        # 清理 apt 缓存
        run_sudo apt-get -yqq autoremove --purge
        run_sudo apt-get -qq clean
        df -Th

    - name: Apt Misc
      id: apt-misc
      if: ${{ 'true' == 'false' }} # disable
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        df -Th

        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

