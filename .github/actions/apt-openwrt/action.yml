name: Apt OpenWrt

description: Apt OpenWrt

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Check in Docker
      id: check-indocker
      shell: bash
      working-directory: /
      run: |
        set -euo pipefail

        # 识别当前是否运行在容器内，供后续跳过 systemd 相关操作
        echo -e "Current working directory: $(pwd)"
        if [ -f /.dockerenv ]; then
          echo "in_container=true" | tee -a "${GITHUB_OUTPUT}"
        else
          echo "in_container=false" | tee -a "${GITHUB_OUTPUT}"
        fi

    - name: Apt OpenWrt
      id: apt-openwrt
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set -euo pipefail

        echo -e "Current working directory: $(pwd)"
        df -Th

        # 统一 root 执行入口，兼容容器内无 sudo 的场景
        run_root() {
          if command -v sudo >/dev/null 2>&1; then
            sudo "$@"
          else
            "$@"
          fi
        }

        run_root apt-get -yqq update

        packages_install=(
          "ack"
          "antlr3"
          "asciidoc"
          "autoconf"
          "automake"
          "autopoint"
          "bc"
          "binutils"
          "bison"
          "build-essential"
          "bzip2"
          "ca-certificates"
          "clang"
          "clangd"
          "cmake"
          "cpio"
          "curl"
          "device-tree-compiler"
          "dwarves"
          "ecj"
          "fastjar"
          "flex"
          "gawk"
          "g++"
          "gcc"
          # "gcc-aarch64-linux-gnu"
          "git"
          "git-lfs"
          "gnupg"
          "gperf"
          "haveged"
          "help2man"
          "intltool"
          "jq"
          "libelf-dev"
          "libglib2.0-dev"
          "libgmp3-dev"
          "libltdl-dev"
          "libmpc-dev"
          "libmpfr-dev"
          "libncurses5-dev"
          "libreadline-dev"
          "libssl-dev"
          "libtool"
          "libxml2"
          "libxml2-utils"
          "lld"
          "lldb"
          "lz4"
          "lzop"
          "make"
          "mkisofs"
          "ninja-build"
          "p7zip-full"
          "patch"
          "pkgconf"
          "python3"
          "python3-pip"
          "python3-setuptools"
          "python3-pysocks"
          "python3-unidecode"
          "re2c"
          "rsync"
          "schedtool"
          "scons"
          "squashfs-tools"
          "subversion"
          "swig"
          "uglifyjs"
          "unzip"
          "vim"
          "wget"
          "xsltproc"
          "zip"
          "zlib1g-dev"
        )

        # 逐包安装，单个包缺失时不中断整个 OpenWrt 依赖准备
        set +e
        for pkg in "${packages_install[@]}"; do
          run_root apt-get -yqq install "$pkg" || echo "Skip missing package: $pkg"
        done
        set -e

    - name: (Apt) Reload
      id: apt-reload
      if: always()
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set -euo pipefail

        echo -e "Current working directory: $(pwd)"

        run_root() {
          if command -v sudo >/dev/null 2>&1; then
            sudo "$@"
          else
            "$@"
          fi
        }

        # 清理 apt 缓存，非容器且存在 systemctl 时再刷新 daemon
        run_root apt-get -yqq autoremove --purge
        run_root apt-get -qq clean
        if [ "${{ steps.check-indocker.outputs.in_container }}" = 'false' ] && command -v systemctl >/dev/null 2>&1; then
          run_root systemctl daemon-reload
        else
          echo "Skip systemctl daemon-reload inside container or when systemctl is unavailable"
        fi
        df -Th

    - name: Apt Misc
      id: apt-misc
      if: ${{ 'true' == 'false' }} # disable
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th

        sudo -E apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        # ========== tmp code ==========
