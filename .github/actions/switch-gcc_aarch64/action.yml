name: Switch GCC AArch64
# Scope: retain the requested compiler version and existing alternatives.
# Risk: compiler package availability follows the active Ubuntu repositories.
# Verify: explicit and default GCC packages with an independent or shared index.
description: Switch GCC AArch64
author: "Grinch27"

inputs:
  gcc_version:
    description: "Version"
    required: false
    default: ""
  apt_index_ready:
    description: Use the APT index refreshed earlier in this job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install and select GCC AArch64
      id: install-gcc-aarch64
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        APT_INDEX_READY: ${{ inputs.apt_index_ready }}
        GCC_VERSION: ${{ inputs.gcc_version }}
      working-directory: /
      run: |
        set -euo pipefail

        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        if [[ "$APT_INDEX_READY" != true ]]; then
          run_sudo_env apt-get -yqq update
        fi
        suffix=${GCC_VERSION:+-${GCC_VERSION}}
        run_sudo_env apt-get -yqq install "gcc${suffix}-aarch64-linux-gnu" "cpp${suffix}-aarch64-linux-gnu"

        if [[ -n "$GCC_VERSION" ]]; then
          tools=(aarch64-linux-gnu-{gcc,cpp,gcc-ar,gcc-nm,gcc-ranlib,gcov,gcov-dump,gcov-tool,lto-dump})
          for tool in "${tools[@]}"; do
            for compiler in "/usr/bin/${tool}-"*; do
              version=${compiler#"/usr/bin/${tool}-"}
              [[ "$version" =~ ^[0-9]+$ ]] || continue
              run_sudo update-alternatives --install "/usr/bin/$tool" "$tool" "$compiler" "$version"
            done
          done
          for tool in "${tools[@]}"; do
            run_sudo update-alternatives --set "$tool" "/usr/bin/${tool}-${GCC_VERSION}"
          done
        fi

        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        aarch64-linux-gnu-gcc --version
