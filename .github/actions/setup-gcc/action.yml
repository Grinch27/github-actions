name: Setup GCC

# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions

description: Setup GCC

author: "Grinch27"

inputs:
  gcc_version:
    description: "GCC version"
    required: false
    default: ""
  gcc_toggle:
    description: "Toggle for GCC"
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: (Toggle) Ubuntu devel for GCC
      id: toggle-apt
      if: ${{ inputs.gcc_toggle == 'devel' }}
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        echo "deb http://archive.ubuntu.com/ubuntu/ devel main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/devel.list
        sudo -E apt-get -yqq update

        # Fix /lib32 by enforcing merged-/usr symlink so dpkg accepts GCC packages
        sudo mkdir -p /usr/lib32
        if [ -L /lib32 ] && [ ! -e /lib32 ]; then
          echo "Repairing dangling /lib32 -> /usr/lib32 symlink"
          sudo ln -sf /usr/lib32 /lib32
        elif [ -d /lib32 ] && [ ! -L /lib32 ]; then
          echo "Converting /lib32 directory into symlink -> /usr/lib32"
          sudo rm -rf /lib32
          sudo ln -s /usr/lib32 /lib32
        fi

    - name: (Toggle) PPA for GCC
      if: ${{ inputs.gcc_toggle == 'ppa' }}
      shell: bash
      working-directory: /
      run: |
        # https://launchpad.net/~ubuntu-toolchain-r/+archive/ubuntu/ppa
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/ppa || true
        sudo -E apt-get -yqq update

    - name: Setup GCC
      shell: bash
      working-directory: /
      env:
        gcc_version: ${{ inputs.gcc_version }}
      run: |
        echo "Current working directory: $(pwd)"
        df -Th

        if [ -n "$gcc_version" ]; then
          pkg_suffix="-$gcc_version"
          lib_version="$gcc_version"
        else
          pkg_suffix=""
          lib_version=""
        fi

        base_packages=(
          # ----- gcc -----
          "gcc${pkg_suffix}"
          "gcc${pkg_suffix}-multilib"
          # ----- g++ -----
          "g++${pkg_suffix}"
          "g++${pkg_suffix}-multilib"
          # ----- cpp -----
          "cpp${pkg_suffix}"
          # ----- gfortran -----
          "gfortran${pkg_suffix}"
        )
        echo "Base packages to be installed: ${base_packages[@]}"
        sudo -E apt-get -yqq install "${base_packages[@]}"

        if [ -z "$lib_version" ]; then
          full_version="$(gcc -dumpfullversion 2>/dev/null || gcc -dumpversion 2>/dev/null || true)"
          lib_version="${full_version%%.*}"
          if [ -z "$lib_version" ]; then
            echo "Failed to detect GCC version for libgcc/libstdc++/libgfortran."
            exit 1
          fi
        fi

        lib_packages=(
          "libgcc-${lib_version}-dev"
          "libstdc++-${lib_version}-dev"
          "libgfortran-${lib_version}-dev"
        )
        echo "Lib packages to be installed: ${lib_packages[@]}"
        sudo -E apt-get -yqq install "${lib_packages[@]}"

        # ========== reload ==========
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E systemctl daemon-reload
        df -Th

    - name: (Remove) Ubuntu devel for GCC
      if: ${{ inputs.gcc_toggle == 'devel' }}
      shell: bash
      working-directory: /
      run: |
        sudo rm /etc/apt/sources.list.d/devel.list
        sudo -E apt-get -yqq update

    - name: (Remove) PPA for GCC
      if: ${{ inputs.gcc_toggle == 'ppa' }}
      shell: bash
      working-directory: /
      run: |
        sudo add-apt-repository --remove ppa:ubuntu-toolchain-r/ppa || true
        sudo -E apt-get -yqq update
