name: Setup Docker

description: Setup Docker

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Check in Docker
      id: check-indocker
      uses: Grinch27/github-actions/.github/actions/check-indocker@main

    - name: Setup Docker
      id: setup-docker
      continue-on-error: true
      env:
        in_container: ${{ steps.check-indocker.outputs.in_container }}
      working-directory: /
      shell: bash
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th
        set -euo pipefail

        run_root() {
          if command -v sudo >/dev/null 2>&1; then
            sudo "$@"
          else
            "$@"
          fi
        }

        # https://docs.docker.com/engine/install/ubuntu/
        # uninstall all conflicting packages (ignore missing)
        for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do
          run_root env DEBIAN_FRONTEND=noninteractive apt-get -y remove "$pkg" || true
        done

        # ===== 1. Set up Docker's apt repository =====
        # Add Docker's official GPG key:
        run_root apt-get update
        run_root env DEBIAN_FRONTEND=noninteractive apt-get -yqq install ca-certificates curl
        run_root install -m 0755 -d /etc/apt/keyrings
        run_root curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        run_root chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          run_root tee /etc/apt/sources.list.d/docker.list > /dev/null
        run_root apt-get update

        # ===== 2. Install the Docker packages =====
        run_root env DEBIAN_FRONTEND=noninteractive apt-get -yqq install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

        # ========== reload ==========
        run_root env DEBIAN_FRONTEND=noninteractive apt-get -yqq autoremove --purge
        run_root apt-get -qq clean
        if [ "${in_container}" = 'false' ] && command -v systemctl >/dev/null 2>&1; then
          run_root systemctl daemon-reload
        else
          echo "Skip systemctl daemon-reload inside container or when systemctl is unavailable"
        fi
        df -Th

        docker --version
