name: Setup Disk
# Scope: common native/container allocation on disposable hosted runners.
# Unknown: underlying storage accounting and real device activation.
# Risk: loop/LVM/mount state; unknown environment or ownership must stop.
# Follow-up: approved real-runner acceptance before production use.
# Verify: detection, same interface, outputs and explicit failure propagation.
description: Prepare one loop-backed LVM workspace on a disposable GitHub-hosted runner or job container.
author: Grinch27
inputs:
  path_build:
    description: Mount point to use
    required: true
    default: ""
  root_num:
    description: Reserved GiB on /
    required: false
    default: "4"
  mnt_num:
    description: Reserved GiB on /mnt
    required: false
    default: "1"
outputs:
  workspace_mode:
    description: lvm, existing, or directory
    value: ${{ steps.disk.outputs.workspace_mode }}
runs:
  using: composite
  steps:
    - name: Detect build environment
      id: detect-environment
      uses: Grinch27/github-actions/.github/actions/check-indocker@main
    - name: Setup build disk
      id: disk
      shell: bash
      env:
        DISK_ENVIRONMENT_KIND: ${{ steps.detect-environment.outputs.environment_kind }}
        path_build: ${{ inputs.path_build }}
        root_num: ${{ inputs.root_num }}
        mnt_num: ${{ inputs.mnt_num }}
      run: bash "$GITHUB_ACTION_PATH/setup-disk.sh"
