name: Setup Disk

description: Setup Disk

author: "Grinch27"

inputs:
  path_build:
    description: Mount point to use
    required: true
    default: ""
  root_num:
    description: Reserved GiB on /
    required: false
    default: "4"
  mnt_num:
    description: Reserved GiB on /mnt
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Check in Docker
      id: check-indocker
      shell: bash
      working-directory: /
      run: |
        set -euo pipefail

        # 输出当前目录并记录是否运行在 Docker 容器内
        echo -e "Current working directory: $(pwd)"
        if [ -f /.dockerenv ]; then
          echo "in_container=true" | tee -a "${GITHUB_OUTPUT}"
        else
          echo "in_container=false" | tee -a "${GITHUB_OUTPUT}"
        fi

    - name: (Apt) Install Disk Tools
      id: install-disk-tools
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        set -euo pipefail

        # 输出当前目录并准备磁盘工具安装
        echo -e "Current working directory: $(pwd)"

        # 统一以当前用户或 sudo 执行系统命令
        run_root() {
          if command -v sudo >/dev/null 2>&1; then
            sudo env "DEBIAN_FRONTEND=${DEBIAN_FRONTEND:-noninteractive}" "$@"
          else
            "$@"
          fi
        }

        # 检查扩盘流程依赖的基础命令
        required_cmds=(df losetup mount mountpoint pvcreate vgcreate lvcreate truncate)
        missing_cmds=()
        for cmd in "${required_cmds[@]}"; do
          if ! command -v "${cmd}" >/dev/null 2>&1; then
            missing_cmds+=("${cmd}")
          fi
        done

        # 检查是否至少存在一种文件系统格式化工具
        if ! command -v mkfs.xfs >/dev/null 2>&1 && ! command -v mkfs.ext4 >/dev/null 2>&1; then
          missing_cmds+=("mkfs")
        fi

        # 依赖完整时直接跳过安装
        if [ "${#missing_cmds[@]}" -eq 0 ]; then
          echo "Disk tools already present"
          exit 0
        fi

        # 缺少包管理器时直接报错
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "apt-get not found, but required disk tools are missing: ${missing_cmds[*]}"
          exit 1
        fi

        # 安装扩盘所需系统包
        echo "Installing packages for missing commands: ${missing_cmds[*]}"
        run_root apt-get -yqq update
        run_root apt-get -yqq install lvm2 util-linux e2fsprogs xfsprogs

    - name: Setup Disk
      id: setup-disk
      shell: bash
      env:
        in_container: ${{ steps.check-indocker.outputs.in_container }}
        path_build: ${{ inputs.path_build }}
        root_num: ${{ inputs.root_num }}
        mnt_num: ${{ inputs.mnt_num }}
      working-directory: /
      run: |
        set -euo pipefail

        # 输出当前目录、运行环境和磁盘状态
        echo "Current working directory: $(pwd)"
        echo "Running setup-disk with in_container=${in_container}"
        df -Th

        # 统一以当前用户或 sudo 执行系统命令
        run_root() {
          if command -v sudo >/dev/null 2>&1; then
            sudo "$@"
          else
            "$@"
          fi
        }

        # 读取指定路径所在文件系统标识
        get_filesystem_key() {
          local mount_path="$1"
          if [ -n "${mount_path}" ] && [ -d "${mount_path}" ]; then
            df -P "${mount_path}" | awk 'END {print $1":"$6}'
          else
            echo ""
          fi
        }

        # 修复容器内丢失的 loop 设备节点
        ensure_loop_devices() {
          local index

          if command -v modprobe >/dev/null 2>&1; then
            run_root modprobe loop >/dev/null 2>&1 || true
          fi

          if command -v mknod >/dev/null 2>&1; then
            if [ ! -e /dev/loop-control ]; then
              run_root mknod -m 660 /dev/loop-control c 10 237 >/dev/null 2>&1 || true
            fi
            for index in $(seq 0 7); do
              if [ ! -b "/dev/loop${index}" ]; then
                run_root mknod -m 660 "/dev/loop${index}" b 7 "${index}" >/dev/null 2>&1 || true
              fi
            done
          fi
        }

        # 绑定 loop 设备，失败时尝试修复节点后重试一次
        attach_loop_device() {
          local file_path="$1"
          local loop_device

          if loop_device=$(run_root losetup --find --show "${file_path}"); then
            printf '%s\n' "${loop_device}"
            return 0
          fi

          echo "Retry losetup after repairing loop devices for ${file_path}"
          ensure_loop_devices
          loop_device=$(run_root losetup --find --show "${file_path}")
          printf '%s\n' "${loop_device}"
        }

        # 校验输入参数
        if [ -z "${path_build}" ]; then
          echo "path_build is required"
          exit 1
        fi

        # 预创建挂载目录
        run_root mkdir -p "${path_build}"

        # 已挂载时直接复用现有目录
        if mountpoint -q "${path_build}"; then
          echo "${path_build} is already mounted"
          run_root chown -R "$(whoami):$(whoami)" "${path_build}"
          df -Th "${path_build}"
          exit 0
        fi

        # 读取指定挂载点的剩余字节数
        get_available_bytes() {
          local mount_path="$1"
          if [ -n "${mount_path}" ] && [ -d "${mount_path}" ]; then
            df -B1 "${mount_path}" | awk 'END {print $4}'
          else
            echo 0
          fi
        }

        add_backing_file() {
          local label="$1"
          local mount_path="$2"
          local file_path="$3"
          local reserve_gib="$4"
          local raw_available reserve_bytes usable_bytes

          # 计算保留空间后的可用容量
          raw_available=$(get_available_bytes "${mount_path}")
          reserve_bytes=$((reserve_gib * 1024 * 1024 * 1024))
          usable_bytes=$((raw_available - reserve_bytes))

          echo "Raw available space in ${label} (bytes): ${raw_available}"
          echo "Usable space in ${label} after reserve (bytes): ${usable_bytes}"

          # 容量足够时登记为待创建的映像文件
          if [ "${usable_bytes}" -lt "${min_file_bytes}" ]; then
            echo "Skip ${label}: usable space ${usable_bytes} is below minimum ${min_file_bytes}"
            return 0
          fi

          file_paths+=("${file_path}")
          file_sizes+=("${usable_bytes}")
        }

        # 校验扩盘流程所需命令
        required_cmds=(df losetup mount mountpoint pvcreate vgcreate lvcreate truncate)
        for cmd in "${required_cmds[@]}"; do
          if ! command -v "${cmd}" >/dev/null 2>&1; then
            echo "Required command not found: ${cmd}"
            exit 1
          fi
        done

        # 校验文件系统格式化工具
        if ! command -v mkfs.xfs >/dev/null 2>&1 && ! command -v mkfs.ext4 >/dev/null 2>&1; then
          echo "No supported mkfs command found"
          exit 1
        fi

        # 先补齐 loop 设备节点，再检查是否可用
        ensure_loop_devices

        # 确认可用 loop 设备
        if ! run_root losetup -f >/dev/null 2>&1; then
          echo "No loop device available for setup-disk"
          exit 1
        fi

        # 生成本次运行的唯一卷组和逻辑卷名称
        vg_suffix=$(printf '%s_%s' "${GITHUB_RUN_ID:-local}" "${GITHUB_RUN_ATTEMPT:-0}" | tr -cs '[:alnum:]_' '_')
        vg_name="github_${vg_suffix}"
        lv_name="runner"
        lv_path="/dev/${vg_name}/${lv_name}"
        min_file_bytes=$((1024 * 1024 * 1024))
        loop_devices=()
        file_paths=()
        file_sizes=()
        root_fs_key=$(get_filesystem_key "/")
        mnt_fs_key=$(get_filesystem_key "/mnt")

        # 失败时回滚挂载、卷组、物理卷和镜像文件
        cleanup_on_error() {
          local exit_code="$?"
          if [ "${exit_code}" -eq 0 ]; then
            return 0
          fi

          set +e
          if mountpoint -q "${path_build}"; then
            run_root umount "${path_build}"
          fi
          if run_root lvdisplay "${lv_path}" >/dev/null 2>&1; then
            run_root lvremove -fy "${lv_path}"
          fi
          if run_root vgdisplay "${vg_name}" >/dev/null 2>&1; then
            run_root vgremove -fy "${vg_name}"
          fi
          for loop_device in "${loop_devices[@]}"; do
            if run_root pvs "${loop_device}" >/dev/null 2>&1; then
              run_root pvremove -ffy "${loop_device}"
            fi
            run_root losetup -d "${loop_device}" >/dev/null 2>&1 || true
          done
          for file_path in "${file_paths[@]}"; do
            run_root rm -f "${file_path}"
          done
          exit "${exit_code}"
        }
        trap cleanup_on_error ERR

        # 根据 /mnt 和 / 的剩余空间登记待创建映像文件
        if [ -n "${mnt_fs_key}" ] && [ "${mnt_fs_key}" = "${root_fs_key}" ]; then
          echo "Skip /mnt: shares the same filesystem with /"
        else
          add_backing_file "/mnt" "/mnt" "/mnt/${vg_name}_mnt.img" "${mnt_num}"
        fi
        add_backing_file "/" "/" "/${vg_name}_root.img" "${root_num}"

        # 两个分区都不足时直接失败
        if [ "${#file_paths[@]}" -eq 0 ]; then
          echo "No usable space available for setup-disk after applying reserved GiB"
          exit 1
        fi

        # 创建映像文件、绑定 loop 设备并初始化物理卷
        for idx in "${!file_paths[@]}"; do
          file_path="${file_paths[$idx]}"
          file_size="${file_sizes[$idx]}"

          run_root mkdir -p "$(dirname "${file_path}")"
          run_root rm -f "${file_path}"
          run_root truncate -s "${file_size}" "${file_path}"

          loop_device=$(attach_loop_device "${file_path}")
          loop_devices+=("${loop_device}")
          echo "Assigned loop device for ${file_path}: ${loop_device}"

          run_root pvcreate -ff -y "${loop_device}"
        done

        # 创建卷组与逻辑卷
        run_root vgcreate "${vg_name}" "${loop_devices[@]}"
        run_root lvcreate -n "${lv_name}" -l 100%FREE "${vg_name}"

        # 优先使用 xfs，否则回退到 ext4
        if command -v mkfs.xfs >/dev/null 2>&1; then
          run_root mkfs.xfs -f "${lv_path}"
        else
          run_root mkfs.ext4 -F "${lv_path}"
        fi

        # 挂载逻辑卷并修正目录权限
        run_root mount "${lv_path}" "${path_build}"
        run_root chown -R "$(whoami):$(whoami)" "${path_build}"

        # 输出扩盘后的磁盘状态
        df -Th
