name: Fix GH Actions In-Docker

description: Fix GH Actions In-Docker

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: (Apt) Install
      id: apt-install
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        echo -e "Current working directory: $(pwd)"
        df -Th

        run_sudo apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        packages_install=(
          "sudo"
          "python3"
          "python3-pip"
        )
        set +e
        for pkg in "${packages_install[@]}"; do
          run_sudo apt-get -yqq install "$pkg" || echo "Skip missing package: $pkg"
        done
        set -e

    - name: (Fix) Python3 Symlink
      id: fix-python
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        # ensure `python` exists for tools that require it
        run_sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: (Apt) Reload
      id: apt-reload
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        echo -e "Current working directory: $(pwd)"
        run_sudo apt-get -yqq autoremove --purge
        run_sudo apt-get -qq clean
        df -Th
