name: Fix GH Actions In-Docker

description: Fix GH Actions In-Docker

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: (Apt) Install
      id: apt-install
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th

        # Requires run-sudo to be installed earlier in this Job.
        run_sudo apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        packages_install=(
          "sudo"
          "systemctl"
          "python3"
          "python3-pip"
        )
        set +e
        for pkg in "${packages_install[@]}"; do
          run_sudo apt-get -yqq install "$pkg" || echo "Skip missing package: $pkg"
        done
        set -e

    - name: (Fix) Python3 Symlink
      id: fix-python
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # ensure `python` exists for tools that require it
        run_sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: (Apt) Reload
      id: apt-reload
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        run_sudo apt-get -yqq autoremove --purge
        run_sudo apt-get -qq clean
        if [ ! -f /.dockerenv ] && [ -d /run/systemd/system ] && command -v systemctl >/dev/null 2>&1; then
          run_sudo systemctl daemon-reload
        else
          echo "Skip systemctl daemon-reload when systemd is not the active init system"
        fi
        df -Th
