name: Compress Files with XZ

description: Compress matching files with xz and split large artifacts

author: "Grinch27"

inputs:
  path_target:
    description: Directory containing files to compress
    required: true
    default: "/"
  input_ext:
    description: Source file extension to compress
    required: false
    default: "tar"
  split_size:
    description: Chunk size used when splitting large compressed files
    required: false
    default: "1900M"
  split_threshold:
    description: Size threshold in bytes for splitting compressed files
    required: false
    default: "2000000000"
  mem_hold:
    description: Reserved memory in MiB before computing xz memlimit
    required: false
    default: "2048"
  memlimit:
    description: Default xz compression memory limit
    required: false
    default: "4GiB"

outputs:
  input_ext:
    description: Input file extension processed by the action
    value: ${{ steps.compress-xz.outputs.input_ext }}
  target_ext:
    description: Output file extension generated by the action
    value: ${{ steps.compress-xz.outputs.target_ext }}
  status:
    description: Compression status
    value: ${{ steps.compress-xz.outputs.status }}

runs:
  using: composite
  steps:
    - name: Compress with xz
      id: compress-xz
      env:
        input_ext: "${{ inputs.input_ext || 'tar' }}"
        split_size: "${{ inputs.split_size || '1990M' }}"
        split_threshold: "${{ inputs.split_threshold || '2000000000'}}"
        mem_hold: "${{ inputs.mem_hold || '2048'}}"
        memlimit: "${{ inputs.memlimit || '4GiB'}}"
        target_ext: "xz"
      working-directory: ${{ inputs.path_target }}
      shell: bash
      run: |
        echo -e "Current working directory: $(pwd)"
        free -h
        ls -lh ./

        available_mem=$(free -m | awk '/^Mem:/{print $7}')
        echo -e "Available memory: ${available_mem} MiB"
        if [[ "${available_mem}" -gt 6144 ]]; then
          memlimit="$((${available_mem} - ${mem_hold}))MiB"
        fi
        echo -e "memlimit: ${memlimit}"

        shopt -s nullglob
        for file in ./*.${input_ext}; do
          if [[ ! -f "${file}" || -d "${file}" ]]; then
            continue
          fi

          xz --compress \
            --threads=0 \
            -9 \
            --extreme \
            --memlimit-compress="${memlimit}" \
            --check=sha256 \
            --verbose \
            "${file}"

          compressed_file="${file}.${target_ext}"
          compressed_size=$(du -b "${compressed_file}" | cut -f1)
          if [[ "${compressed_size}" -gt "${split_threshold}" ]]; then
            echo -e "Split ${compressed_file} with chunk size ${split_size}"
            split -b "${split_size}" \
              --numeric-suffixes=1 \
              --suffix-length=3 \
              "${compressed_file}" "${compressed_file}.part"
            rm -f "${compressed_file}"
            ls -lh "${compressed_file}.part"*
          fi
        done

        ls -lh ./
        # echo "input_ext=${input_ext}" | tee -a "${GITHUB_OUTPUT}"
        echo "target_ext=${target_ext}" | tee -a "${GITHUB_OUTPUT}"
        echo "status=success" | tee -a "${GITHUB_OUTPUT}"
