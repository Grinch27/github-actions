name: Resolve Runner Image
description: Resolve the latest explicit Ubuntu x64 GitHub Actions runs-on label
author: "Grinch27"

inputs:
  source_url:
    description: "actions/runner-images README raw URL"
    required: false
    default: "https://raw.githubusercontent.com/actions/runner-images/main/README.md"

outputs:
  runner_image:
    description: "Resolved runs-on label, for example ubuntu-26.04"
    value: ${{ steps.resolve.outputs.runner_image || 'ubuntu-latest' }}

runs:
  using: composite
  steps:
    - name: Resolve runner
      id: resolve
      shell: bash
      env:
        SOURCE_URL: ${{ inputs.source_url }}
      run: |
        set -euo pipefail

        python3 - "$SOURCE_URL" <<'PY' >> "$GITHUB_OUTPUT"
        import re
        import sys
        import urllib.request

        url = sys.argv[1]
        req = urllib.request.Request(
            url,
            headers={
                "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36",
                "Accept": "text/plain",
            },
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            text = resp.read().decode("utf-8", "replace")

        items = []
        for line in text.splitlines():
            if "Ubuntu" not in line or "x64" not in line:
                continue
            for label in re.findall(r"`(ubuntu-[0-9]{2}\.[0-9]{2})`", line):
                version = label.removeprefix("ubuntu-")
                items.append((tuple(map(int, version.split("."))), label))

        if not items:
            raise SystemExit("No Ubuntu x64 runner label found.")

        items.sort(reverse=True)
        print(f"runner_image={items[0][1]}")
        PY
