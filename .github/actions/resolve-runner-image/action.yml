name: Resolve Runner Image
description: Resolve the latest explicit Ubuntu x64 GitHub Actions runner image
author: "Grinch27"

inputs:
  source_url:
    description: "actions/runner-images README raw URL"
    required: false
    default: "https://raw.githubusercontent.com/actions/runner-images/main/README.md"

outputs:
  RUNNER_IMAGE:
    description: "Resolved runner image label, for example ubuntu-26.04"
    value: ${{ steps.resolve.outputs.RUNNER_IMAGE }}

runs:
  using: composite
  steps:
    - name: Resolve runner image
      id: resolve
      shell: bash
      env:
        SOURCE_URL: ${{ inputs.source_url }}
      run: |
        set -euo pipefail

        python3 - "$SOURCE_URL" <<'PY' >> "$GITHUB_OUTPUT"
        import re
        import sys
        import urllib.request

        source_url = sys.argv[1]
        headers = {
            "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36",
            "Accept": "text/plain",
        }

        try:
            req = urllib.request.Request(source_url, headers=headers)
            with urllib.request.urlopen(req, timeout=30) as resp:
                text = resp.read().decode("utf-8", "replace")
        except Exception as exc:
            print(f"::warning::Failed to fetch runner-images README: {exc}", file=sys.stderr)
            print("RUNNER_IMAGE=ubuntu-latest")
            raise SystemExit(0)

        labels = set()
        for line in text.splitlines():
            if "Ubuntu" in line and "x64" in line:
                labels.update(re.findall(r"`(ubuntu-[0-9]{2}\.[0-9]{2})`", line))

        if not labels:
            print("::warning::No Ubuntu x64 runner image found; falling back to ubuntu-latest.", file=sys.stderr)
            print("RUNNER_IMAGE=ubuntu-latest")
            raise SystemExit(0)

        RUNNER_IMAGE = max(
            labels,
            key=lambda label: tuple(map(int, label.removeprefix("ubuntu-").split("."))),
        )

        print(f"RUNNER_IMAGE={RUNNER_IMAGE}")
        PY
