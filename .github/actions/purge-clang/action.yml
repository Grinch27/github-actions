name: Purge Clang

description: Purge Clang

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Ensure run_sudo
      uses: Grinch27/github-actions/.github/actions/run-sudo@main

    - name: Purge Clang
      shell: bash
      continue-on-error: true
      working-directory: /
      run: |
        echo -e "Current working directory: $(pwd)"
        df -Th
        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        regexes=(
          "clang-[0-9]+.*"
          "clang-format-[0-9]+.*"
          "clang-tidy-[0-9]+.*"
          "clangd-[0-9]+.*"
          # "lld-[0-9]+.*"
          # "lldb-[0-9]+.*"
        )
        packages_purge=()
        for regex in "${regexes[@]}"; do
          for package in $package_installed; do
            if [[ $package =~ $regex ]]; then
              packages_purge+=("$package")
            fi
          done
        done
        echo "Packages to be purged: ${packages_purge[@]}"

        set +e
        for package in "${packages_purge[@]}"; do
          echo "Attempting to remove $package"
          run_sudo_env apt-get -yqq autoremove --purge "$package"
          if [[ $? -ne 0 ]]; then
            echo "Failed to remove $package"
          fi
        done
        set -e

        # ========== reload ==========
        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
