name: Setup Clang

description: Setup Clang

author: "Grinch27"

inputs:
  clang_version:
    description: "Version"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Clang
      shell: bash
      working-directory: /
      env:
        clang_version: ${{ inputs.clang_version }}
      run: |
        if [ -n "$clang_version" ]; then
          pkg_suffix="-$clang_version"
          lib_version="$clang_version"
        else
          pkg_suffix=""
          lib_version=""
        fi
        packages_install=(
          "clang${pkg_suffix}"
          "clang-format${pkg_suffix}"
          "clang-tidy${pkg_suffix}"
          "clangd${pkg_suffix}"
          "lld${pkg_suffix}"
          "lldb${pkg_suffix}"
        )
        echo "Packages to be installed: ${packages_install[@]}"
        sudo -E apt-get -yqq install "${packages_install[@]}"

        # ========== reload ==========
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E systemctl daemon-reload
        df -Th
