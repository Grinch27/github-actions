name: Setup Clang

description: Setup Clang

author: "Grinch27"

inputs:
  clang_version:
    description: "Version"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: (Vars) Resolve suffix
      id: vars
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        clang_version: ${{ inputs.clang_version }}
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        df -Th
        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        if [ -n "${{ env.clang_version }}" ]; then
          pkg_suffix="-${{ env.clang_version }}"
          lib_version="${{ env.clang_version }}"
        else
          pkg_suffix=""
          lib_version=""
        fi
        echo "pkg_suffix=$pkg_suffix" >> "$GITHUB_OUTPUT"
        echo "lib_version=$lib_version" >> "$GITHUB_OUTPUT"

    - name: Setup Clang
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        clang_version: ${{ inputs.clang_version }}
        pkg_suffix: ${{ steps.vars.outputs.pkg_suffix }}
        lib_version: ${{ steps.vars.outputs.lib_version }}
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        packages_install=(
          "clang${{ env.pkg_suffix }}"
          "clang-format${{ env.pkg_suffix }}"
          "clang-tidy${{ env.pkg_suffix }}"
          "clangd${{ env.pkg_suffix }}"
          "lld${{ env.pkg_suffix }}"
          "lldb${{ env.pkg_suffix }}"
        )
        echo "Packages to be installed: ${packages_install[@]}"
        run_sudo_env apt-get -yqq install "${packages_install[@]}"

    - name: (Apt) Reload
      id: apt-reload
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
