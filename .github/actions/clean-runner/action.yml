name: Clean Runner

description: Clean Runner

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Clean Runner
      shell: bash
      continue-on-error: true
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        df -Th
        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        # ===== Clean Apt =====
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md

        # ----- package for purge -----
        packages_purge=(
          "docker*"
          "ghc*"
          "zulu*"
          "google*"
          "firefox*"
          "dotnet*"
          "powershell*"
          "microsoft-edge*"
          "sqlite*"
          "postgresql*"
          "mysql*"
          "mongodb*"
          "moby*"
          "apache2*"
          "nginx*"
          "php*"
        )
        run_sudo_env apt-get -yqq autoremove --purge "${packages_purge[@]}"

        # ===== Clean Browsers and Drivers =====
        run_sudo_env rm -rf /usr/local/share/chromedriver-linux64
        run_sudo_env rm -rf /usr/local/share/chromium
        run_sudo_env rm -rf /usr/local/share/edge_driver
        run_sudo_env rm -rf /usr/local/share/gecko_driver
        run_sudo_env rm -rf /usr/share/java/selenium-server.jar

        # ===== Clean PowerShell Tools =====
        run_sudo_env rm -rf /usr/local/share/powershell

        # ===== Clean AGENT_TOOLSDIRECTORY =====
        # 如果环境变量 AGENT_TOOLSDIRECTORY 不为空，则删除该目录及其所有内容
        [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && run_sudo rm -rf "${AGENT_TOOLSDIRECTORY}"

        # ===== Clean Swap =====
        # 关闭所有交换空间 删除指定的交换文件
        run_sudo swapoff -a
        run_sudo rm -f /swapfile /mnt/swapfile

        # ========== reload ==========
        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
