name: Purge GCC

description: Purge GCC

author: "Grinch27"

runs:
  using: composite
  steps:
    - name: Purge GCC
      shell: bash
      continue-on-error: true
      working-directory: /
      run: |
        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        echo -e "Current working directory: $(pwd)"
        df -Th
        run_sudo_env apt-get -yqq update
        package_installed=$(dpkg-query -W -f='${binary:Package}\n')

        regexes=(
          "gcc-[0-9]+.*"
          "libgcc-[0-9]+.*"
          "g++-[0-9]+.*"
          "cpp-[0-9]+.*"
          "libstdc++-[0-9]+.*"
          "gfortran-[0-9]+.*"
          "libgfortran-[0-9]+.*"
        )
        packages_purge=()
        for regex in "${regexes[@]}"; do
          for package in $package_installed; do
            if [[ $package =~ $regex ]]; then
              packages_purge+=("$package")
            fi
          done
        done
        echo "Packages to be purged: ${packages_purge[@]}"

        set +e
        for package in "${packages_purge[@]}"; do
          echo "Attempting to remove $package"
          run_sudo_env apt-get -yqq autoremove --purge $package
          if [[ $? -ne 0 ]]; then
            echo "Failed to remove $package"
          fi
        done
        set -e

        # ========== reload ==========
        run_sudo_env apt-get -yqq autoremove --purge
        run_sudo_env apt-get -qq clean
        df -Th
