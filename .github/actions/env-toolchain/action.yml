name: Environment for toolchain

# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions

description: Environment for toolchain

author: "Grinch27"

# # ----- gcc -----
# gcc_purge: true
# gcc_install: true
# gcc_switch: true
# gcc_version: 14
# # ----- clang -----
# clang_purge: true
# clang_install: true
# clang_switch: true
# clang_version: 19
# # ----- jdk -----
# jdk_purge: true
# jdk_install: true
# jdk_switch: true
# jdk_version: 21
# # ----- docker -----
# docker_install: false
# qemu_install: false

inputs:
  # ----- gcc -----
  gcc_purge:
    description: "gcc_purge"
    required: false
    default: "false"
  gcc_install:
    description: "gcc_install"
    required: false
    default: "false"
  gcc_switch:
    description: "gcc_switch"
    required: false
    default: "false"
  gcc_version:
    description: "gcc_version"
    required: false
    default: ""
  gcc_aarch64:
    description: "gcc_aarch64"
    required: false
    default: "false"
  # ----- clang -----
  clang_purge:
    description: "clang_purge"
    required: false
    default: "false"
  clang_install:
    description: "clang_install"
    required: false
    default: "false"
  clang_switch:
    description: "clang_switch"
    required: false
    default: "false"
  clang_version:
    description: "clang_version"
    required: false
    default: ""
  # ----- jdk -----
  jdk_purge:
    description: "jdk_purge"
    required: false
    default: "false"
  jdk_install:
    description: "jdk_install"
    required: false
    default: "false"
  jdk_switch:
    description: "jdk_switch"
    required: false
    default: "false"
  jdk_version:
    description: "jdk_version"
    required: false
    default: ""
  # ----- docker -----
  docker_install:
    description: "docker_install"
    required: false
    default: "false"
  qemu_install:
    description: "qemu_install"
    required: false
    default: "false"
  purge_snap:
    description: "purge_snap"
    required: false
    default: "true"
  clean_docker_image:
    description: "clean_docker_image"
    required: false
    default: "true"
  clean_runner:
    description: "clean_runner"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # ========== General Environment Setup: Start ==========
    - name: (Purge) Snap
      id: purge-snap
      if: ${{ inputs.purge_snap == 'true' }}
      uses: Grinch27/github-actions/.github/actions/purge-snap@main

    - name: (Clean) Docker Images
      id: clean-docker
      if: ${{ inputs.clean_docker_image == 'true' }}
      uses: Grinch27/github-actions/.github/actions/clean-docker_image@main

    - name: (Clean) Runner
      id: clean-runner
      if: ${{ inputs.clean_runner == 'true' }}
      uses: Grinch27/github-actions/.github/actions/clean-runner@main

    - name: (Resolve) Toolchain Versions
      id: resolve-toolchain
      uses: Grinch27/github-actions/.github/actions/resolve-toolchain-version@main

    - name: (Resolve) Effective Toolchain Versions
      id: toolchain
      shell: bash
      env:
        NEED_GCC: ${{ inputs.gcc_install == 'true' || inputs.gcc_switch == 'true' || inputs.gcc_aarch64 == 'true' }}
        NEED_CLANG: ${{ inputs.clang_install == 'true' || inputs.clang_switch == 'true' }}
        NEED_JDK: ${{ inputs.jdk_install == 'true' || inputs.jdk_switch == 'true' }}
        GCC_VERSION: ${{ inputs.gcc_version || steps.resolve-toolchain.outputs.gcc_version }}
        CLANG_VERSION: ${{ inputs.clang_version || steps.resolve-toolchain.outputs.clang_version }}
        JDK_VERSION: ${{ inputs.jdk_version || steps.resolve-toolchain.outputs.jdk_version }}
      run: |
        set -euo pipefail

        fail() {
          printf '::error::%s\n' "$*" >&2
          exit 1
        }

        [ "$NEED_GCC" != "true" ] || [ -n "$GCC_VERSION" ] || fail "gcc_version is required but could not be resolved."
        [ "$NEED_CLANG" != "true" ] || [ -n "$CLANG_VERSION" ] || fail "clang_version is required but could not be resolved."
        [ "$NEED_JDK" != "true" ] || [ -n "$JDK_VERSION" ] || fail "jdk_version is required but could not be resolved."

        {
          printf 'gcc_version=%s\n' "$GCC_VERSION"
          printf 'clang_version=%s\n' "$CLANG_VERSION"
          printf 'jdk_version=%s\n' "$JDK_VERSION"
        } >> "$GITHUB_OUTPUT"

        printf 'Effective toolchain versions: gcc=%s clang=%s jdk=%s\n' "$GCC_VERSION" "$CLANG_VERSION" "$JDK_VERSION"

    - name: (Purge) Existing GCC
      id: purge-gcc
      if: ${{ inputs.gcc_purge == 'true' }}
      uses: Grinch27/github-actions/.github/actions/purge-gcc@main

    - name: (Setup) GCC - ${{ steps.toolchain.outputs.gcc_version }}
      id: setup-gcc
      if: ${{ inputs.gcc_install == 'true' }}
      uses: Grinch27/github-actions/.github/actions/setup-gcc@main
      with:
        gcc_version: ${{ steps.toolchain.outputs.gcc_version }}

    - name: (Switch) Installed GCC - ${{ steps.toolchain.outputs.gcc_version }}
      id: switch-gcc
      if: ${{ inputs.gcc_install == 'true' || inputs.gcc_switch == 'true' }}
      uses: Grinch27/github-actions/.github/actions/switch-gcc@main
      with:
        gcc_version: ${{ steps.toolchain.outputs.gcc_version }}

    - name: (Purge) Existing Clang
      id: purge-clang
      if: ${{ inputs.clang_purge == 'true' }}
      uses: Grinch27/github-actions/.github/actions/purge-clang@main

    - name: (Setup) Clang - ${{ steps.toolchain.outputs.clang_version }}
      id: setup-clang
      if: ${{ inputs.clang_install == 'true' }}
      uses: Grinch27/github-actions/.github/actions/setup-clang@main
      with:
        clang_version: ${{ steps.toolchain.outputs.clang_version }}

    - name: (Switch) Installed Clang - ${{ steps.toolchain.outputs.clang_version }}
      id: switch-clang
      if: ${{ inputs.clang_install == 'true' || inputs.clang_switch == 'true' }}
      uses: Grinch27/github-actions/.github/actions/switch-clang@main
      with:
        clang_version: ${{ steps.toolchain.outputs.clang_version }}

    - name: (Switch) AArch64 Cross-Compiler - ${{ steps.toolchain.outputs.gcc_version }}
      id: switch-gcc_aarch64
      if: ${{ inputs.gcc_aarch64 == 'true' }}
      uses: Grinch27/github-actions/.github/actions/switch-gcc_aarch64@main
      with:
        gcc_version: ${{ steps.toolchain.outputs.gcc_version }}

    - name: (Purge) JDK
      id: purge-jdk
      if: ${{ inputs.jdk_purge == 'true' }}
      uses: Grinch27/github-actions/.github/actions/purge-jdk@main

    - name: (Setup) JDK - ${{ steps.toolchain.outputs.jdk_version }}
      id: setup-jdk
      if: ${{ inputs.jdk_install == 'true' || inputs.jdk_switch == 'true' }}
      uses: actions/setup-java@main
      with:
        distribution: "temurin"
        java-version: ${{ steps.toolchain.outputs.jdk_version }}

    - name: (Setup) Docker
      id: setup-docker
      if: ${{ inputs.docker_install == 'true' }}
      uses: Grinch27/github-actions/.github/actions/setup-docker@main

    - name: (Setup) QEMU
      id: setup-qemu
      if: ${{ inputs.qemu_install == 'true' }}
      uses: docker/setup-qemu-action@master
      # with:
      #   platforms: ${{ inputs.arch_branch }}

    - name: (Check) toolchain
      id: check-toolchain
      if: ${{ inputs.gcc_install == 'true' || inputs.gcc_switch == 'true' }}
      continue-on-error: true
      uses: Grinch27/github-actions/.github/actions/check-toolchain@main

    # ========== General Environment Setup: End ==========
