name: Load Custom Environment Variables
# Scope: typed toolchain overrides and delayed build directories.
# Unknown: external callers relying on old eager path creation.
# Risk: expression-to-shell injection and accidental path creation.
# Follow-up: audit additional consumers before changing the allowlist.
# Verify: all-or-nothing env writes, no value logging, confined paths.
description: Validate toolchain overrides and prepare build directories without logging unrelated environment variables.
author: Grinch27
inputs:
  phase:
    description: load (default), paths only after mounting, or explicit both for a prepared directory
    required: false
    default: load
runs:
  using: composite
  steps:
    - name: Load custom variables and/or prepare paths
      shell: bash
      env:
        CUSTOM_ENV_TEXT: ${{ env.custom_env }}
        CUSTOM_ENV_PHASE: ${{ inputs.phase }}
      run: bash "$GITHUB_ACTION_PATH/input-custom.sh"
