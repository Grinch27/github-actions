name: Resolve Toolchain Versions
description: Resolve latest installable GCC, Clang, and OpenJDK major versions from the current apt environment
author: "Grinch27"

outputs:
  gcc_version:
    description: "Resolved GCC major version."
    value: ${{ steps.resolve.outputs.gcc_version }}
  clang_version:
    description: "Resolved Clang major version."
    value: ${{ steps.resolve.outputs.clang_version }}
  jdk_version:
    description: "Resolved OpenJDK major version."
    value: ${{ steps.resolve.outputs.jdk_version }}
  custom_env:
    description: "Semicolon-separated environment assignments for input-custom."
    value: ${{ steps.resolve.outputs.custom_env }}

runs:
  using: composite
  steps:
    - name: Resolve toolchain versions
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        python3 <<'PY'
        import os
        import re
        import shutil
        import subprocess
        import sys

        def fail(message):
            print(f"::error::{message}", file=sys.stderr)
            raise SystemExit(1)

        def need(command):
            if not shutil.which(command):
                fail(f"{command} is required.")

        def run(args):
            return subprocess.run(args, check=True, text=True, capture_output=True).stdout

        def apt_update():
            command = ["apt-get", "-yqq", "update"]
            if os.geteuid() != 0:
                need("sudo")
                command = ["sudo", "-E", *command]
            subprocess.run(command, check=True)

        def has_candidate(package):
            output = run(["apt-cache", "policy", package])
            match = re.search(r"^\s*Candidate:\s*(\S+)", output, re.MULTILINE)
            return bool(match and match.group(1) != "(none)")

        def latest(pattern, regex, package_name):
            output = run(["apt-cache", "search", "--names-only", pattern])
            versions = set()

            for line in output.splitlines():
                name = line.split(maxsplit=1)[0] if line else ""
                match = regex.fullmatch(name)
                if match:
                    versions.add(int(match.group(1)))

            for version in sorted(versions, reverse=True):
                package = package_name(version)
                if has_candidate(package):
                    return str(version)

            fail(f"No installable package candidate found for pattern: {pattern}")

        for command in ("apt-get", "apt-cache"):
            need(command)

        apt_update()

        gcc_version = latest(
            r"^gcc-[0-9]+$",
            re.compile(r"gcc-([0-9]+)"),
            lambda version: f"gcc-{version}",
        )

        clang_version = latest(
            r"^clang-[0-9]+$",
            re.compile(r"clang-([0-9]+)"),
            lambda version: f"clang-{version}",
        )

        jdk_version = latest(
            r"^openjdk-[0-9]+-jdk$",
            re.compile(r"openjdk-([0-9]+)-jdk"),
            lambda version: f"openjdk-{version}-jdk",
        )

        custom_env = f"gcc_version={gcc_version};clang_version={clang_version};jdk_version={jdk_version}"

        lines = [
            f"gcc_version={gcc_version}",
            f"clang_version={clang_version}",
            f"jdk_version={jdk_version}",
            f"custom_env={custom_env}",
        ]

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("\n".join(lines) + "\n")

        print(f"Resolved toolchain versions: gcc={gcc_version} clang={clang_version} jdk={jdk_version}")
        PY
