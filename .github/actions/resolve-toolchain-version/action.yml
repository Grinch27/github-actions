name: Resolve Toolchain Versions
description: Resolve latest installable GCC, Clang, and OpenJDK major versions from the current apt environment
author: "Grinch27"

outputs:
  gcc_version:
    description: "Resolved GCC major version."
    value: ${{ steps.resolve.outputs.gcc_version }}
  clang_version:
    description: "Resolved Clang major version."
    value: ${{ steps.resolve.outputs.clang_version }}
  jdk_version:
    description: "Resolved OpenJDK major version."
    value: ${{ steps.resolve.outputs.jdk_version }}
  custom_env:
    description: "Semicolon-separated environment assignments for input-custom."
    value: ${{ steps.resolve.outputs.custom_env }}

runs:
  using: composite
  steps:
    - name: Resolve latest installable toolchain versions
      id: resolve
      shell: bash
      run: |
        # Key decisions needing confirmation:
        # - Always resolve the latest installable versions from the current apt environment.
        # - JDK is resolved from openjdk-N-jdk packages in apt.
        # Ambiguities:
        # - This action does not accept explicit version overrides.
        # Follow-up research:
        # - Add non-apt sources only if downstream workflows require them.
        # Risks and verification focus:
        # - apt repository drift changes outputs between runs.
        set -euo pipefail

        fail() {
          printf '::error::%s\n' "$*" >&2
          exit 1
        }

        as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo -E "$@"
          fi
        }

        apt_has_candidate() {
          local package="$1"
          local candidate
          candidate="$(apt-cache policy "$package" | awk '/Candidate:/ {print $2; exit}')"
          [ -n "$candidate" ] && [ "$candidate" != "(none)" ]
        }

        latest_major_from_apt() {
          local prefix="$1"
          local version
          local package
          while IFS= read -r version; do
            package="${prefix}-${version}"
            if apt_has_candidate "$package"; then
              printf '%s\n' "$version"
              return 0
            fi
          done < <(
            apt-cache search --names-only "^${prefix}-[0-9]+$" |
              awk '{print $1}' |
              sed -nE "s/^${prefix}-([0-9]+)$/\1/p" |
              sort -nr
          )
          return 1
        }

        latest_openjdk_from_apt() {
          local version
          local package
          while IFS= read -r version; do
            package="openjdk-${version}-jdk"
            if apt_has_candidate "$package"; then
              printf '%s\n' "$version"
              return 0
            fi
          done < <(
            apt-cache search --names-only '^openjdk-[0-9]+-jdk$' |
              awk '{print $1}' |
              sed -nE 's/^openjdk-([0-9]+)-jdk$/\1/p' |
              sort -nr
          )
          return 1
        }

        command -v apt-get >/dev/null 2>&1 || fail "apt-get is required."
        command -v apt-cache >/dev/null 2>&1 || fail "apt-cache is required."
        command -v awk >/dev/null 2>&1 || fail "awk is required."
        command -v sed >/dev/null 2>&1 || fail "sed is required."
        command -v sort >/dev/null 2>&1 || fail "sort is required."

        as_root apt-get -yqq update

        gcc_version="$(latest_major_from_apt gcc)" || fail "No installable gcc-N package candidate found."
        clang_version="$(latest_major_from_apt clang)" || fail "No installable clang-N package candidate found."
        jdk_version="$(latest_openjdk_from_apt)" || fail "No installable openjdk-N-jdk package candidate found."
        custom_env="gcc_version=${gcc_version};clang_version=${clang_version};jdk_version=${jdk_version}"

        {
          printf 'gcc_version=%s\n' "$gcc_version"
          printf 'clang_version=%s\n' "$clang_version"
          printf 'jdk_version=%s\n' "$jdk_version"
          printf 'custom_env=%s\n' "$custom_env"
        } >> "$GITHUB_OUTPUT"

        printf 'Resolved toolchain versions: gcc=%s clang=%s jdk=%s\n' "$gcc_version" "$clang_version" "$jdk_version"
