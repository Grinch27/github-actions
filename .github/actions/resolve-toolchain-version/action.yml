name: Resolve Toolchain Versions
# Verify version selection from fresh and caller-provided Ubuntu APT indexes.
description: Resolve latest installable GCC, Clang, and OpenJDK major versions from the current apt environment
author: "Grinch27"

inputs:
  apt_index_ready:
    description: Use the APT index refreshed earlier in this job.
    required: false
    default: "false"

outputs:
  gcc_version:
    description: "Resolved GCC major version."
    value: ${{ steps.resolve.outputs.gcc_version }}
  clang_version:
    description: "Resolved Clang major version."
    value: ${{ steps.resolve.outputs.clang_version }}
  jdk_version:
    description: "Resolved OpenJDK major version."
    value: ${{ steps.resolve.outputs.jdk_version }}
  custom_env:
    description: "Semicolon-separated environment assignments for input-custom."
    value: ${{ steps.resolve.outputs.custom_env }}

runs:
  using: composite
  steps:
    - name: Prepare resolver runtime and APT index
      shell: bash
      env:
        APT_INDEX_READY: ${{ inputs.apt_index_ready }}
      run: |
        set -euo pipefail

        # Scope: Bash Step-local privilege wrapper; no cross-Step function dependency.
        # Assumption: id is present; non-root requires non-interactive sudo.
        # Risk: container capabilities are not granted by this wrapper.
        # Verify: arguments, command exit status, and continued Step execution.
        run_sudo() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n "$@"
          else
            printf 'run_sudo: root privileges required\n' >&2
            return 1
          fi
        }

        run_sudo_env() {
          local name
          local -a env_args=()
          for name in DEBIAN_FRONTEND DEBCONF_NONINTERACTIVE_SEEN APT_LISTCHANGES_FRONTEND NEEDRESTART_MODE LANG LC_ALL TZ; do
            if [[ -v "$name" ]]; then
              env_args+=("${name}=${!name}")
            fi
          done
          run_sudo env "${env_args[@]}" "$@"
        }

        need() {
          command -v "$1" >/dev/null 2>&1 || {
            echo "::error::$1 is required."
            exit 1
          }
        }

        need apt-get
        need apt-cache

        packages=()
        command -v python3 >/dev/null 2>&1 || packages+=(python3)
        if ! command -v update-ca-certificates >/dev/null 2>&1 || [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
          packages+=(ca-certificates)
        fi

        export DEBIAN_FRONTEND="${DEBIAN_FRONTEND:-noninteractive}"
        if [[ "$APT_INDEX_READY" != true ]]; then
          run_sudo_env apt-get -yqq update
        fi
        if (( ${#packages[@]} )); then
          run_sudo_env apt-get install -y --no-install-recommends "${packages[@]}"
          run_sudo update-ca-certificates
        fi

    - name: Resolve toolchain versions
      id: resolve
      shell: bash
      env:
        LC_ALL: C
      run: |
        set -euo pipefail

        python3 <<'PY'
        import os
        import re
        import subprocess
        import sys

        def fail(message):
            print(f"::error::{message}", file=sys.stderr)
            raise SystemExit(1)

        def run(args):
            return subprocess.run(args, check=True, text=True, capture_output=True).stdout

        def has_candidate(package):
            output = run(["apt-cache", "policy", package])
            match = re.search(r"^\s*Candidate:\s*(\S+)", output, re.MULTILINE)
            return bool(match and match.group(1) != "(none)")

        def latest(pattern, regex, package_name):
            output = run(["apt-cache", "search", "--names-only", pattern])
            versions = set()

            for line in output.splitlines():
                name = line.split(maxsplit=1)[0] if line else ""
                match = regex.fullmatch(name)
                if match:
                    versions.add(int(match.group(1)))

            for version in sorted(versions, reverse=True):
                package = package_name(version)
                if has_candidate(package):
                    return str(version)

            fail(f"No installable package candidate found for pattern: {pattern}")

        gcc_version = latest(
            r"^gcc-[0-9]+$",
            re.compile(r"gcc-([0-9]+)"),
            lambda version: f"gcc-{version}",
        )

        clang_version = latest(
            r"^clang-[0-9]+$",
            re.compile(r"clang-([0-9]+)"),
            lambda version: f"clang-{version}",
        )

        jdk_version = latest(
            r"^openjdk-[0-9]+-jdk$",
            re.compile(r"openjdk-([0-9]+)-jdk"),
            lambda version: f"openjdk-{version}-jdk",
        )

        custom_env = f"gcc_version={gcc_version};clang_version={clang_version};jdk_version={jdk_version}"

        lines = [
            f"gcc_version={gcc_version}",
            f"clang_version={clang_version}",
            f"jdk_version={jdk_version}",
            f"custom_env={custom_env}",
        ]

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("\n".join(lines) + "\n")

        print(f"Resolved toolchain versions: gcc={gcc_version} clang={clang_version} jdk={jdk_version}")
        PY
