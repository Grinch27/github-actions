name: Resolve Toolchain Versions
description: Resolve latest installable GCC, Clang, and JDK major versions for the current runner
author: "Grinch27"

inputs:
  gcc_version:
    description: "Explicit GCC major version. Empty, auto, or latest resolves from apt."
    required: false
    default: ""
  clang_version:
    description: "Explicit Clang major version. Empty, auto, or latest resolves from apt."
    required: false
    default: ""
  jdk_version:
    description: "Explicit JDK major version. Empty, auto, or latest resolves from selected source."
    required: false
    default: ""
  jdk_source:
    description: "JDK version source: temurin or apt."
    required: false
    default: "temurin"
  jdk_channel:
    description: "JDK release channel when jdk_source is temurin: feature or lts."
    required: false
    default: "feature"
  apt_update:
    description: "Run apt-get update before resolving apt package candidates."
    required: false
    default: "true"
  write_env:
    description: "Write resolved gcc_version, clang_version, and jdk_version to GITHUB_ENV."
    required: false
    default: "false"

outputs:
  gcc_version:
    description: "Resolved GCC major version."
    value: ${{ steps.resolve.outputs.gcc_version }}
  clang_version:
    description: "Resolved Clang major version."
    value: ${{ steps.resolve.outputs.clang_version }}
  jdk_version:
    description: "Resolved JDK major version."
    value: ${{ steps.resolve.outputs.jdk_version }}
  custom_env:
    description: "Semicolon-separated environment assignments for input-custom."
    value: ${{ steps.resolve.outputs.custom_env }}

runs:
  using: composite
  steps:
    - name: Resolve latest installable toolchain versions
      id: resolve
      shell: bash
      env:
        INPUT_GCC_VERSION: ${{ inputs.gcc_version }}
        INPUT_CLANG_VERSION: ${{ inputs.clang_version }}
        INPUT_JDK_VERSION: ${{ inputs.jdk_version }}
        INPUT_JDK_SOURCE: ${{ inputs.jdk_source }}
        INPUT_JDK_CHANNEL: ${{ inputs.jdk_channel }}
        INPUT_APT_UPDATE: ${{ inputs.apt_update }}
        INPUT_WRITE_ENV: ${{ inputs.write_env }}
      run: |
        # Key decisions needing confirmation:
        # - GCC/Clang latest versions are resolved from apt package candidates available on the current runner.
        # - JDK defaults to Temurin because env-toolchain currently uses actions/setup-java with distribution=temurin.
        # Ambiguities:
        # - "latest" can mean latest feature release or latest LTS; jdk_channel controls that for Temurin.
        # Follow-up research:
        # - If setup-gcc gains gcc_toggle support inside env-toolchain, this resolver may need matching apt source toggles.
        # Risks and verification focus:
        # - Network/API or apt repository drift can change resolved versions between workflow runs.
        # - Verify outputs before passing them to setup/switch actions.
        set -Eeuo pipefail

        fail() {
          printf '::error::%s\n' "$*" >&2
          exit 1
        }

        as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo -E "$@"
          fi
        }

        is_auto() {
          case "${1:-}" in
            ""|"auto"|"latest") return 0 ;;
            *) return 1 ;;
          esac
        }

        require_major() {
          local value="$1"
          local name="$2"
          [[ "$value" =~ ^[0-9]+$ ]] || fail "${name} must be an integer major version, got: ${value}"
        }

        apt_has_candidate() {
          local package="$1"
          local candidate
          candidate="$(apt-cache policy "$package" | awk '/Candidate:/ {print $2; exit}')"
          [ -n "$candidate" ] && [ "$candidate" != "(none)" ]
        }

        latest_major_from_apt() {
          local prefix="$1"
          local version
          local package
          while IFS= read -r version; do
            package="${prefix}-${version}"
            if apt_has_candidate "$package"; then
              printf '%s\n' "$version"
              return 0
            fi
          done < <(
            apt-cache search --names-only "^${prefix}-[0-9]+$" |
              awk '{print $1}' |
              sed -nE "s/^${prefix}-([0-9]+)$/\1/p" |
              sort -nr
          )
          return 1
        }

        latest_openjdk_from_apt() {
          local version
          local package
          while IFS= read -r version; do
            package="openjdk-${version}-jdk"
            if apt_has_candidate "$package"; then
              printf '%s\n' "$version"
              return 0
            fi
          done < <(
            apt-cache search --names-only '^openjdk-[0-9]+-jdk$' |
              awk '{print $1}' |
              sed -nE 's/^openjdk-([0-9]+)-jdk$/\1/p' |
              sort -nr
          )
          return 1
        }

        latest_temurin_jdk() {
          local channel="$1"
          local machine
          local adoptium_arch
          machine="$(uname -m)"
          case "$machine" in
            x86_64|amd64) adoptium_arch="x64" ;;
            aarch64|arm64) adoptium_arch="aarch64" ;;
            armv7l|armv7) adoptium_arch="arm" ;;
            ppc64le) adoptium_arch="ppc64le" ;;
            s390x) adoptium_arch="s390x" ;;
            *) fail "Unsupported architecture for Temurin resolver: ${machine}" ;;
          esac
          [ "$(uname -s | tr '[:upper:]' '[:lower:]')" = "linux" ] || fail "Temurin resolver currently supports Linux runners only."
          python3 - "$channel" "$adoptium_arch" <<'PY'
        import json
        import sys
        import urllib.request

        channel = sys.argv[1]
        architecture = sys.argv[2]
        if channel not in ("feature", "lts"):
            raise SystemExit(f"Unsupported jdk_channel: {channel}")

        with urllib.request.urlopen("https://api.adoptium.net/v3/info/available_releases", timeout=30) as response:
            info = json.load(response)

        key = "available_lts_releases" if channel == "lts" else "available_releases"
        releases = sorted({int(item) for item in info.get(key, [])}, reverse=True)
        for release in releases:
            url = (
                f"https://api.adoptium.net/v3/assets/latest/{release}/hotspot"
                f"?architecture={architecture}&image_type=jdk&jvm_impl=hotspot&os=linux&vendor=eclipse"
            )
            try:
                with urllib.request.urlopen(url, timeout=30) as response:
                    assets = json.load(response)
            except Exception:
                continue
            if assets:
                print(release)
                raise SystemExit(0)

        raise SystemExit("No installable Temurin JDK release found for this runner.")
        PY
        }

        command -v apt-cache >/dev/null 2>&1 || fail "apt-cache is required for GCC/Clang resolution."
        command -v awk >/dev/null 2>&1 || fail "awk is required."
        command -v sed >/dev/null 2>&1 || fail "sed is required."
        command -v sort >/dev/null 2>&1 || fail "sort is required."

        case "${INPUT_APT_UPDATE}" in
          true) as_root apt-get -yqq update ;;
          false) ;;
          *) fail "apt_update must be true or false." ;;
        esac

        if is_auto "$INPUT_GCC_VERSION"; then
          gcc_version="$(latest_major_from_apt gcc)" || fail "No installable gcc-N package candidate found."
        else
          gcc_version="$INPUT_GCC_VERSION"
          require_major "$gcc_version" "gcc_version"
        fi

        if is_auto "$INPUT_CLANG_VERSION"; then
          clang_version="$(latest_major_from_apt clang)" || fail "No installable clang-N package candidate found."
        else
          clang_version="$INPUT_CLANG_VERSION"
          require_major "$clang_version" "clang_version"
        fi

        if is_auto "$INPUT_JDK_VERSION"; then
          case "$INPUT_JDK_SOURCE" in
            temurin)
              command -v python3 >/dev/null 2>&1 || fail "python3 is required for Temurin JDK resolution."
              jdk_version="$(latest_temurin_jdk "$INPUT_JDK_CHANNEL")"
              ;;
            apt)
              jdk_version="$(latest_openjdk_from_apt)" || fail "No installable openjdk-N-jdk package candidate found."
              ;;
            *)
              fail "jdk_source must be temurin or apt."
              ;;
          esac
        else
          jdk_version="$INPUT_JDK_VERSION"
          require_major "$jdk_version" "jdk_version"
        fi

        custom_env="gcc_version=${gcc_version};clang_version=${clang_version};jdk_version=${jdk_version}"
        {
          printf 'gcc_version=%s\n' "$gcc_version"
          printf 'clang_version=%s\n' "$clang_version"
          printf 'jdk_version=%s\n' "$jdk_version"
          printf 'custom_env=%s\n' "$custom_env"
        } >> "$GITHUB_OUTPUT"

        case "$INPUT_WRITE_ENV" in
          true)
            {
              printf 'gcc_version=%s\n' "$gcc_version"
              printf 'clang_version=%s\n' "$clang_version"
              printf 'jdk_version=%s\n' "$jdk_version"
            } >> "$GITHUB_ENV"
            ;;
          false) ;;
          *) fail "write_env must be true or false." ;;
        esac

        printf 'Resolved toolchain versions: gcc=%s clang=%s jdk=%s\n' "$gcc_version" "$clang_version" "$jdk_version"
