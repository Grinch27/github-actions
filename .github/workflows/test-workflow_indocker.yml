name: (Test-Docker) Workflow

# Github Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases

run-name: Workflow ${{ inputs.action || '' }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-workflow_indocker.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action ref: owner/repo/path@ref"
        required: false
        default: "Grinch27/github-actions/.github/actions/check-toolchain@main"
        type: string

permissions:
  contents: read

env:
  ACTION: ${{ inputs.action || 'Grinch27/github-actions/.github/actions/check-toolchain@main' }}

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      runner_image: ${{ steps.resolve-runner-image.outputs.runner_image }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  toolchain:
    name: ${{ needs.runner-image.outputs.runner_image }} - ubuntu:devel - toolchain
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.runner_image }}
    outputs:
      gcc_version: ${{ steps.resolve-toolchain.outputs.gcc_version }}
      clang_version: ${{ steps.resolve-toolchain.outputs.clang_version }}
      jdk_version: ${{ steps.resolve-toolchain.outputs.jdk_version }}
      custom_env: ${{ steps.resolve-toolchain.outputs.custom_env }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: &container_image ubuntu:devel
      options: &container_options >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes: &container_volumes
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Resolve toolchain versions
        id: resolve-toolchain
        uses: Grinch27/github-actions/.github/actions/resolve-toolchain-version@main

  action:
    name: ${{ needs.runner-image.outputs.runner_image }} - gcc-${{ needs.toolchain.outputs.gcc_version }}
    needs:
      - runner-image
      - toolchain
    runs-on: ${{ needs.runner-image.outputs.runner_image }}
    permissions: write-all
    defaults:
      run:
        shell: bash
    container:
      image: *container_image
      options: *container_options
      volumes: *container_volumes
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Prepare action
        id: action-clone
        env:
          ACTION: ${{ env.ACTION }}
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          update-ca-certificates

          spec="${ACTION%@*}"
          ref="${ACTION##*@}"
          repo="$(cut -d/ -f1-2 <<< "$spec")"
          path="$(cut -d/ -f3- <<< "$spec")"

          test "$spec" != "$ACTION"
          test -n "$repo"
          test -n "$path"
          test -n "$ref"

          git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" _repo
          cp -a "_repo/${path}" _action

      - name: Run action
        id: action-run
        uses: ./_action
