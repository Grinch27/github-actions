name: (Test-Docker) Workflow

run-name: Workflow ${{ inputs.action || '' }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-workflow_indocker.yml"
      - ".github/actions/resolve-runner-image/**"
      - ".github/actions/resolve-toolchain-version/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action ref: owner/repo/path@ref"
        required: false
        default: "Grinch27/github-actions/.github/actions/env-toolchain@main"
        type: string

permissions:
  contents: read

env:
  ACTION: ${{ inputs.action || 'Grinch27/github-actions/.github/actions/env-toolchain@main' }}

jobs:
  runner-image:
    name: Version of runner-image
    runs-on: ubuntu-latest
    outputs:
      runner_image: ${{ steps.resolve-runner-image.outputs.runner_image }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

      - name: Check runner-image
        shell: bash
        run: test -n "${{ steps.resolve-runner-image.outputs.runner_image }}"

  toolchain:
    name: Version of toolchain
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.runner_image }}
    outputs:
      gcc_version: ${{ steps.resolve-toolchain.outputs.gcc_version }}
      clang_version: ${{ steps.resolve-toolchain.outputs.clang_version }}
      jdk_version: ${{ steps.resolve-toolchain.outputs.jdk_version }}
      custom_env: ${{ steps.resolve-toolchain.outputs.custom_env }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:devel
      options: >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
      volumes:
        - /dev:/dev
        - /sys:/sys:ro
        - /sys/fs/cgroup:/sys/fs/cgroup
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Bootstrap resolver runtime
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3
          update-ca-certificates

      - name: Resolve toolchain versions
        id: resolve-toolchain
        uses: Grinch27/github-actions/.github/actions/resolve-toolchain-version@main

      - name: Check toolchain version outputs
        run: |
          set -euo pipefail
          test -n "${{ steps.resolve-toolchain.outputs.gcc_version }}"
          test -n "${{ steps.resolve-toolchain.outputs.clang_version }}"
          test -n "${{ steps.resolve-toolchain.outputs.jdk_version }}"
          printf 'gcc=%s clang=%s jdk=%s\n' \
            "${{ steps.resolve-toolchain.outputs.gcc_version }}" \
            "${{ steps.resolve-toolchain.outputs.clang_version }}" \
            "${{ steps.resolve-toolchain.outputs.jdk_version }}"

  action:
    name: ${{ needs.runner-image.outputs.runner_image }} gcc-${{ needs.toolchain.outputs.gcc_version }}
    needs:
      - runner-image
      - toolchain
    runs-on: ${{ needs.runner-image.outputs.runner_image }}
    permissions: write-all
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:devel
      options: >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
      volumes:
        - /dev:/dev
        - /sys:/sys:ro
        - /sys/fs/cgroup:/sys/fs/cgroup
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Prepare action
        id: action-clone
        env:
          ACTION: ${{ env.ACTION }}
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          update-ca-certificates

          spec="${ACTION%@*}"
          ref="${ACTION##*@}"
          repo="$(cut -d/ -f1-2 <<< "$spec")"
          path="$(cut -d/ -f3- <<< "$spec")"

          test "$spec" != "$ACTION"
          test -n "$repo"
          test -n "$path"
          test -n "$ref"

          git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" _repo
          cp -a "_repo/${path}" _action

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("_action/action.yml")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r"uses:\s+Grinch27/github-actions/\.github/actions/([^@\s]+)@(main|master)",
              r"uses: ./_repo/.github/actions/\1",
              text,
          )

          p.write_text(text, encoding="utf-8")
          PY

          if grep -nE 'uses: Grinch27/github-actions/\.github/actions/.+@(main|master)' _action/action.yml; then
            echo "::error::Nested remote github-actions sibling action remains in _action/action.yml"
            exit 1
          fi

      - name: Run action
        id: action-run
        uses: ./_action
        with:
          gcc_purge: "false"
          gcc_install: "true"
          gcc_switch: "false"
          gcc_version: ${{ needs.toolchain.outputs.gcc_version }}
          gcc_aarch64: "false"
          clang_purge: "false"
          clang_install: "false"
          clang_switch: "false"
          clang_version: ${{ needs.toolchain.outputs.clang_version }}
          jdk_purge: "false"
          jdk_install: "false"
          jdk_switch: "false"
          jdk_version: ${{ needs.toolchain.outputs.jdk_version }}
          docker_install: "false"
          qemu_install: "false"
          purge_snap: "false"
          clean_docker_image: "false"
          clean_runner: "false"
