name: Check Shared AGENTS Part I

# GitHub Actions workflow syntax:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

on:
  push:
    branches: [main]
    paths:
      - docs/agents/part-i.md
      - scripts/agents_part_i.py
      - .github/workflows/check-agents-part-i.yml
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    name: Resolve runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  verify:
    name: Compare canonical Part I across six repositories
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Check shared rules (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/agents_part_i.py --check
