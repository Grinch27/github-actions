name: Code (Dev)

# https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions
run-name: Testing Matrix

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/code_dev.yml"
      - ".github/actions/setup-gcc/**"

permissions: write-all

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  job:
    name: Testing Matrix
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        gcc_toggle: ["ppa", "devel", "false"]
    env:
      gcc_version: "15"
      gcc_purge: "false"
      gcc_install: "true"
      gcc_switch: "true"
    steps:
      - name: (Purge) Existing GCC
        id: purge-gcc
        if: ${{ env.gcc_purge == 'true' }}
        uses: Grinch27/github-actions/.github/actions/purge-gcc@main

      - name: (Setup) GCC - ${{ env.gcc_version }}
        id: setup-gcc
        if: ${{ env.gcc_install == 'true' }}
        uses: Grinch27/github-actions/.github/actions/setup-gcc@main
        with:
          gcc_version: ${{ env.gcc_version }}
          gcc_toggle: ${{ matrix.gcc_toggle }}

      - name: (Switch) Installed GCC - ${{ env.gcc_version }}
        id: switch-gcc
        if: ${{ env.gcc_switch == 'true' }}
        uses: Grinch27/github-actions/.github/actions/switch-gcc@main
        with:
          gcc_version: ${{ env.gcc_version }}
