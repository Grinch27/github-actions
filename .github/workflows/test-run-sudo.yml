name: (Test) run_sudo

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/run-sudo/**"
      - ".github/workflows/test-run-sudo.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTAINER_IMAGE: &container_image ubuntu:devel

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  runner:
    needs: runner-image
    name: Ubuntu runner
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Install run_sudo
        uses: Grinch27/github-actions/.github/actions/run-sudo@main
      - name: Verify subsequent step
        shell: bash
        run: |
          set -euo pipefail
          command -v run_sudo
          test "$(run_sudo id -u)" = 0
          run_sudo true
          if run_sudo false; then
            echo 'run_sudo did not propagate command failure' >&2
            exit 1
          fi
  container:
    needs: runner-image
    name: ${{ needs.runner-image.outputs.CONTAINER_IMAGE }} - container without sudo dependency
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      image: *container_image
      options: --user=0:0
    steps:
      - name: Install run_sudo
        uses: Grinch27/github-actions/.github/actions/run-sudo@main
      - name: Verify subsequent step
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 0
          command -v run_sudo
          test "$(run_sudo id -u)" = 0
          run_sudo true
          if run_sudo false; then
            echo 'run_sudo did not propagate command failure' >&2
            exit 1
          fi
