name: Test Workflow

run-name: Test ${{ inputs.action }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-workflow.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action ref: owner/repo/path@ref"
        required: false
        default: "Grinch27/github-actions/.github/actions/resolve-toolchain-version@main"
        type: string

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.runner.outputs.runs_on }}
    steps:
      - name: Resolve runner
        id: runner
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

      - name: Print resolved runner
        shell: bash
        run: |
          printf 'runs_on=%s\n' "${{ steps.runner.outputs.runs_on }}"
          test -n "${{ steps.runner.outputs.runs_on }}"

  action:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runs_on || 'ubuntu-latest' }}
    steps:
      - name: Prepare action
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          spec="${ACTION%@*}"
          ref="${ACTION##*@}"
          repo="$(printf '%s\n' "$spec" | cut -d/ -f1-2)"
          path="$(printf '%s\n' "$spec" | cut -d/ -f3-)"

          test "$spec" != "$ACTION"
          test -n "$repo"
          test -n "$path"
          test -n "$ref"

          git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" _repo
          cp -a "_repo/${path}" _action

      - name: Run action
        id: action
        uses: ./_action
