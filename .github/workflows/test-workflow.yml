name: Test Workflow

run-name: Test ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action ref: owner/repo/path@ref"
        required: false
        default: "Grinch27/github-actions/.github/actions/resolve-toolchain-version@main"
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.runner.outputs.runs_on }}
    steps:
      - name: Resolve runner
        id: runner
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

      - name: Print resolved runner
        shell: bash
        run: |
          printf 'runs_on=%s\n' "${{ steps.runner.outputs.runs_on }}"
          test -n "${{ steps.runner.outputs.runs_on }}"

  test:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runs_on || 'ubuntu-latest' }}
    steps:
      - name: Prepare action
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          spec="${ACTION%@*}"
          ref="${ACTION##*@}"
          repo="$(printf '%s\n' "$spec" | cut -d/ -f1-2)"
          path="$(printf '%s\n' "$spec" | cut -d/ -f3-)"

          test "$spec" != "$ACTION"
          test -n "$repo"
          test -n "$path"
          test -n "$ref"

          git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" _repo
          cp -a "_repo/${path}" _action

      - name: Run action
        id: action
        uses: ./_action

      - name: Print outputs
        shell: bash
        run: |
          printf 'runs_on=%s\n' "${{ needs.resolve.outputs.runs_on }}"
          printf 'gcc_version=%s\n' "${{ steps.action.outputs.gcc_version }}"
          printf 'clang_version=%s\n' "${{ steps.action.outputs.clang_version }}"
          printf 'jdk_version=%s\n' "${{ steps.action.outputs.jdk_version }}"
          printf 'custom_env=%s\n' "${{ steps.action.outputs.custom_env }}"
