name: (Test) Workflow

# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax

run-name: Workflow ${{ inputs.action || '' }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-workflow.yml"
      - ".github/actions/resolve-runner-image/**"
      - ".github/actions/resolve-toolchain-version/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action ref: owner/repo/path@ref"
        required: false
        default: "Grinch27/github-actions/.github/actions/resolve-toolchain-version@main"
        type: string

permissions:
  contents: read

env:
  ACTION: ${{ inputs.action || 'Grinch27/github-actions/.github/actions/resolve-toolchain-version@main' }}

jobs:
  runner-image:
    name: Resolve runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions: write-all
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # FORCE_UNSAFE_CONFIGURE: "1"
    steps:
      - name: Prepare action
        id: action-clone
        shell: bash
        env:
          ACTION: ${{ env.ACTION }}
        run: |
          set -euo pipefail
          spec="${ACTION%@*}"
          ref="${ACTION##*@}"
          repo="$(cut -d/ -f1-2 <<< "$spec")"
          path="$(cut -d/ -f3- <<< "$spec")"
          test "$spec" != "$ACTION"
          test -n "$repo"
          test -n "$path"
          test -n "$ref"
          git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" _repo
          cp -a "_repo/${path}" _action

      - name: Run action
        id: action-run
        uses: ./_action
